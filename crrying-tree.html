<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>إعادة بناء عالمنا</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    <!-- إضافة خط VT323 للستايل البيكسل للنصوص الإنجليزية -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&family=VT323&display=swap" rel="stylesheet">
    <style>
        /* --- تنسيقات أساسية --- */
        body {
            margin: 0;
            overflow: hidden;
            background-color: #ffe5ec; /* خلفية وردية ناعمة */
            font-family: 'Tajawal', sans-serif; /* خط عربي لطيف */
            user-select: none;
            -webkit-user-select: none;
            direction: rtl;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* --- طبقة الواجهة --- */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }

        .hud-text {
            color: #8e7dbe;
            text-shadow: 2px 2px 0px #fff;
            font-size: 24px;
            font-weight: bold;
            pointer-events: auto;
        }

        #progress-container {
            align-self: center;
            background: rgba(255, 255, 255, 0.8);
            border: 4px solid #ffc8dd;
            border-radius: 15px;
            padding: 10px 20px;
            margin-top: 10px;
            text-align: center;
            box-shadow: 0 4px 0 #ffafcc;
        }

        #instructions {
            font-size: 24px;
            color: #ff8fab;
            font-weight: bold;
        }

        /* --- زر الدلو (تصميم جديد) --- */
        #bucket-btn {
            pointer-events: auto;
            background: #fff;
            border: 6px solid #8ecae6; /* حدود سميكة */
            border-radius: 0; /* مربع حاد */
            width: 90px;
            height: 90px;
            font-size: 45px;
            cursor: pointer;
            box-shadow: 6px 6px 0px #219ebc; /* ظل بيكسل صلب */
            transition: transform 0.1s, box-shadow 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 20px; /* مساحة للنص */
        }

        #bucket-btn.full {
            background: #bde0fe;
            border-color: #219ebc;
        }

        #bucket-btn:active {
            transform: translate(6px, 6px); /* تأثير الضغط لأسفل */
            box-shadow: 0 0 0 #219ebc;
        }

        .bucket-label {
            position: absolute;
            bottom: -35px;
            font-family: 'VT323', monospace; /* خط بيكسل إنجليزي */
            font-size: 24px;
            color: #219ebc;
            width: 200px;
            text-align: center;
            text-shadow: 2px 2px 0 #fff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* --- حاوية التحكم --- */
        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
            pointer-events: none;
        }

        /* --- نافذة الرسائل --- */
        #message-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 90%;
            max-width: 400px;
            background: #fff0f3;
            border: 6px solid #bde0fe;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 10px 0 #a2d2ff, 0 20px 20px rgba(0,0,0,0.1);
            display: none;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: auto;
            z-index: 20;
        }

        #message-modal.active {
            display: block;
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .pixel-heart {
            font-size: 40px;
            color: #ff5d8f;
            margin-bottom: 10px;
            animation: pulse 1s infinite;
        }

        .modal-text {
            font-family: 'Tajawal', sans-serif;
            color: #6d6875;
            font-size: 22px;
            line-height: 1.6;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .modal-btn {
            background: #bde0fe;
            border: none;
            padding: 10px 25px;
            font-family: 'Tajawal', sans-serif;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 0 #8ecae6;
            transition: transform 0.1s;
        }

        .modal-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #8ecae6;
        }

        /* --- الرسالة النهائية --- */
        #final-letter {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 240, 243, 0.95);
            z-index: 100;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }

        .letter-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            border: 4px dashed #ffc8dd;
            max-width: 500px;
            text-align: center;
        }

        h1 { color: #ff5d8f; font-family: 'Tajawal', sans-serif; margin-top: 0; }
        p { color: #555; font-size: 20px; line-height: 1.6; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 30px;
            color: #ff8fab;
            z-index: 50;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="loading">جاري بناء العالم...</div>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div id="progress-container">
            <div id="instructions">املأ الدلو من النهر أو اضغط على المطر</div>
            <div id="status" style="font-size: 18px; color: #b5838d;">النمو: 0%</div>
        </div>
        
        <div class="controls-row">
            <div class="hud-text" style="align-self: flex-start; margin-top: auto;">القلوب المجمعة: <span id="heart-count">0</span></div>
            
            <!-- زر الدلو -->
            <div style="pointer-events: auto; display: flex; flex-direction: column; align-items: center;">
                <button id="bucket-btn" onclick="handleBucketClick()">
                    🪣
                    <div class="bucket-label" id="bucket-label">EMPTY</div>
                </button>
            </div>
        </div>
    </div>

    <!-- نافذة المجاملات -->
    <div id="message-modal">
        <div class="pixel-heart">❤</div>
        <div class="modal-text" id="modal-msg">أنتِ جميلة جداً.</div>
        <button class="modal-btn" onclick="closeModal()">سأحفظها في قلبي</button>
    </div>

    <!-- الشاشة النهائية -->
    <div id="final-letter">
        <div class="letter-content">
            <h1>أنا آسف حقاً.</h1>
            <p>مثل هذه الشجرة تماماً، الثقة تحتاج وقتاً لتنمو وتكبر، لكنني مستعد لسقيها والاعتناء بها كل يوم.</p>
            <p>شكراً لأنك منحتني فرصة الحديث من قلبي.</p>
            <br>
            <button class="modal-btn" style="background:#ffc8dd; box-shadow: 0 4px 0 #ff90b3;" onclick="location.reload()">البقاء هنا قليلاً</button>
        </div>
    </div>

    <script>
        // --- البيانات: 100+ رسالة اعتذار ومجاملة صادقة ---
        const COMPLIMENTS = [
            "ابتسامتك هي النور الذي يضيء عالمي.",
            "أنا معجب بطيبتك، حتى في أصعب الأوقات.",
            "أنتِ تستحقين كل الصدق والحب.",
            "ضحكتك هي صوتي المفضل.",
            "أنا آسف لأنني تسببت لكِ بالألم.",
            "أريد أن أكون الرجل الذي تستحقينه.",
            "حدسك دائماً في مكانه، وأنا أحترم ذلك.",
            "أفتقد النظرة التي كنتِ تنظرين إلي بها بثقة.",
            "أنتِ قوية بشكل لا يصدق.",
            "قلبك نادر وثمين جداً.",
            "رأيك يهمني أكثر من أي شخص آخر.",
            "أنا أتعلم من أخطائي لأجلك.",
            "وجودك يجعل العالم مكاناً ألطف.",
            "أحترم حدودك ومساحتك الشخصية.",

            "عقلك وتفكيرك يبهرني دائماً.",
            "أحب طريقة اهتمامك بالآخرين.",
            "أنا أستمع إليكِ، أستمع بصدق.",
            "أنتِ جميلة، من الداخل والخارج.",
            "حياتي أفضل بوجودك فيها.",

            "أنتِ أعز أصدقائي.",
            "أنا معجب بصبرك الطويل.",

            "لديكِ مواهب رائعة.",
            "أحب رقتك ولطفك.",
            "أريد أن أدعم أحلامك وطموحاتك.",
            "أنتِ مشرقة، حتى في لحظات حزنك.",
            "سأنتظر طالما تطلب الأمر.",
            "سعادتك هي أولويتي.",
            "أحب مدى تفكيرك واهتمامك بالتفاصيل.",
            "أنا ملتزم بالتغيير للأفضل.",
            "أنتِ تحفة فنية.",
            "أحب نبرة صوتك.",
            "أنا أراكِ، وأقدرك حقاً.",
            "سأعمل بجد لاستعادة ثقتك.",
            "أنتِ فريدة من نوعك في كل شيء.",
            "أحب الطريقة التي ترين بها العالم.",
            "أنتِ تكفين وزيادة. أنتِ كل شيء.",
            "أندم لأنني جعلتك تشكّين في نفسك.",
            "أعدك بأن أكون واضحاً وشفافاً.",
            "حضنك هو أكثر الأماكن راحة.",
            "أحب شجاعتك.",
            "أنتِ نعمة في حياتي.",
            "أريد أن أرى ابتسامتك مجدداً.",
            "أنتِ أهم شخص بالنسبة لي.",
            "أحب وجهة نظرك في الحياة.",
            "أنا آسف لكل دمعة تسببت بها.",

            "أنتِ تأسرين القلوب.",
            "أريد أن أكبر في العمر معك.",
            "أحب مقدار اهتمامك بالتفاصيل.",
            "أنتِ معيار الجمال بالنسبة لي.",
            "أنا مخلص لعلاقتنا.",
            "أنتِ تلونين حياتي بأجمل الألوان.",
            "أحب إبداعك.",
            "أنا آسف لأنني لم أكن بجانبك عندما احتجتِ إلي.",
            "أنتِ شمسي المشرقة.",
            "أحب كيف تتحديني لأكون أفضل.",
            "أنتِ مميزة جداً.",
            "أريد أن أمسك يدك مجدداً.",
            "لديكِ حكمة تفوق عمرك.",
            "أحب عفويتك.",
            "أنتِ مثالية كما أنتِ.",
            "أنا آسف على أنانيتي.",
            "أنتِ ملكة قلبي.",
            "أحب صمودك وقوتك.",
            "أريد أن أحمي قلبك.",
            "أنتِ متألقة.",
            "أحب ذوقك في الموسيقى.",
            "أنا آسف لأنني اعتبرت وجودك أمراً مسلماً به.",
            "أنتِ وطني.",
            "أحب طريقتك في التعبير عن نفسك.",
            "أنتِ أنيقة وراقية.",
            "أريد أن نصنع ذكريات سعيدة جديدة.",
            "أنتِ تعريف الحب.",
            "أحب روحك الجميلة.",
            "أنا آسف على الألم الذي سببته.",
            "أنتِ حلم تحقق.",
            "أحب صدقك وصراحتك.",
            "أنتِ ساحرة.",
            "لن أتوقف عن المحاولة لأجلك.",
            "أنتِ مساحتي الآمنة.",
            "أحب طاقتك الإيجابية.",
            "أنتِ لا تقدرين بثمن.",
            "أنا آسف لكسر ثقتك.",
            "أنتِ محبوبة.",
            "أنتِ غالية جداً.",
            "أنتِ كل دنيتي."
        ];

        COMPLIMENTS.sort(() => Math.random() - 0.5);

        // --- نظام الصوت ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'rain') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                gainNode.gain.setValueAtTime(0.05, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'splash') { // صوت الماء
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.linearRampToValueAtTime(300, now + 0.2);
                gainNode.gain.setValueAtTime(0.2, now);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'grow') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.linearRampToValueAtTime(400, now + 0.3);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'fruit') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, now);
                osc.frequency.exponentialRampToValueAtTime(1000, now + 0.2);
                gainNode.gain.setValueAtTime(0.1, now);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            }
        }

        // --- إعدادات THREE.JS ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffe5ec); 
        scene.fog = new THREE.Fog(0xffe5ec, 10, 50);

        const aspect = window.innerWidth / window.innerHeight;
        const d = 20;
        const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
        camera.position.set(20, 20, 20); 
        camera.lookAt(scene.position);

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // --- المواد والخامات ---
        function createPixelTexture(color, type = 'block') {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            
            if (type === 'water') {
                 // ماء شبه شفاف
                ctx.fillStyle = color;
                ctx.fillRect(0, 0, 64, 64);
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.fillRect(10, 10, 20, 5); // تموجات
                ctx.fillRect(40, 40, 15, 5);
            } else {
                ctx.fillStyle = color;
                ctx.fillRect(0, 0, 64, 64);
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.fillRect(0, 0, 64, 4); 
                ctx.fillRect(0, 0, 4, 64); 
                ctx.fillStyle = 'rgba(0,0,0,0.1)';
                ctx.fillRect(0, 60, 64, 4); 
                ctx.fillRect(60, 0, 4, 64); 
            }

            if (type === 'fruit') {
                ctx.fillStyle = '#333';
                ctx.fillRect(15, 25, 8, 8);
                ctx.fillRect(41, 25, 8, 8);
                ctx.fillStyle = '#ffcc00';
                ctx.fillRect(28, 35, 8, 6);
                ctx.fillStyle = '#333';
                ctx.fillRect(5, 30, 8, 2);
                ctx.fillRect(5, 38, 8, 2);
                ctx.fillRect(51, 30, 8, 2);
                ctx.fillRect(51, 38, 8, 2);
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(45, 10, 15, 10);
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.magFilter = THREE.NearestFilter;
            tex.minFilter = THREE.NearestFilter;
            return tex;
        }

        const grassMat = new THREE.MeshLambertMaterial({ map: createPixelTexture('#bde0fe', 'block') });
        const woodMat = new THREE.MeshLambertMaterial({ map: createPixelTexture('#cdb4db', 'block') });
        const leafMat = new THREE.MeshLambertMaterial({ map: createPixelTexture('#ffafcc', 'block') });
        const fruitMat = new THREE.MeshLambertMaterial({ map: createPixelTexture('#ffc8dd', 'fruit') });
        const waterMat = new THREE.MeshLambertMaterial({ map: createPixelTexture('#48cae4', 'water'), transparent: true, opacity: 0.8 });

        // --- بناء الأرضية والنهر ---
        const groundGroup = new THREE.Group();
        scene.add(groundGroup);
        const riverBlocks = [];

        // إنشاء شبكة أرضية
        for (let x = -5; x <= 5; x++) {
            for (let z = -5; z <= 5; z++) {
                // جعل الصفوف الأخيرة نهراً
                if (x >= 4) {
                    const geo = new THREE.BoxGeometry(2, 1.8, 2); // الماء أقصر قليلاً
                    const mesh = new THREE.Mesh(geo, waterMat);
                    mesh.position.set(x * 2, -2.2, z * 2); // منخفض قليلاً
                    mesh.receiveShadow = true;
                    mesh.userData = { isRiver: true };
                    groundGroup.add(mesh);
                    riverBlocks.push(mesh);
                } else {
                    const geo = new THREE.BoxGeometry(2, 2, 2);
                    const mesh = new THREE.Mesh(geo, grassMat);
                    mesh.position.set(x * 2, -2, z * 2);
                    mesh.receiveShadow = true;
                    groundGroup.add(mesh);
                }
            }
        }

        // --- الشجرة ---
        const treeGroup = new THREE.Group();
        scene.add(treeGroup);
        
        let treeStage = 0;
        let growthPoints = 0;
        const POINTS_PER_STAGE = 20;
        let fruits = [];

        function addBlock(x, y, z, material, scale = 1, isFruit = false) {
            const geo = new THREE.BoxGeometry(2 * scale, 2 * scale, 2 * scale);
            const mesh = new THREE.Mesh(geo, material);
            mesh.position.set(x, y, z);
            mesh.scale.set(0, 0, 0); 
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            
            if (isFruit) {
                mesh.userData = { isFruit: true, id: fruits.length };
                fruits.push(mesh);
            }

            treeGroup.add(mesh);

            new TWEEN.Tween(mesh.scale)
                .to({ x: 1, y: 1, z: 1 }, 600)
                .easing(TWEEN.Easing.Elastic.Out)
                .start();
            
            playSound('grow');
        }

        function updateTree() {
            if (treeStage === 1) {
                addBlock(0, 0, 0, woodMat, 0.5); 
                addBlock(0, 1, 0, leafMat, 0.5); 
                document.getElementById('instructions').innerText = "استمر في السقي...";
            }
            else if (treeStage === 2) {
                addBlock(0, 0, 0, woodMat); 
                addBlock(0, 2, 0, woodMat); 
                addBlock(0, 4, 0, leafMat);
                addBlock(2, 2, 0, leafMat);
                addBlock(-2, 2, 0, leafMat);
                addBlock(0, 2, 2, leafMat);
                addBlock(0, 2, -2, leafMat);
            }
            else if (treeStage === 3) {
                addBlock(0, 4, 0, woodMat);
                addBlock(0, 6, 0, woodMat);
                for(let x=-2; x<=2; x++) {
                    for(let z=-2; z<=2; z++) {
                        for(let y=4; y<=8; y+=2) {
                             if(Math.abs(x)+Math.abs(z) < 3 && Math.random() > 0.3) {
                                 addBlock(x*2, y, z*2, leafMat);
                             }
                        }
                    }
                }
            }
            else if (treeStage === 4) {
                document.getElementById('instructions').innerText = "اجمع الثمار";
                document.getElementById('status').innerText = "اكتمل نمو الشجرة";
                document.getElementById('bucket-btn').style.display = 'none'; // إخفاء الدلو عند الاكتمال
                
                const positions = [
                    [2, 3, 2], [-2, 5, 2], [2, 6, -2], [-2, 4, -2],
                    [0, 7, 2], [0, 5, -2], [3, 4, 0], [-3, 6, 0]
                ];
                positions.forEach((pos, index) => {
                    setTimeout(() => {
                        addBlock(pos[0]*2, pos[1], pos[2]*2, fruitMat, 0.6, true);
                    }, index * 200);
                });
            }
        }

        // --- المطر ---
        const rainCount = 300;
        const rainGeo = new THREE.BufferGeometry();
        const rainPos = new Float32Array(rainCount * 3);
        for(let i=0; i<rainCount*3; i+=3) {
            rainPos[i] = (Math.random() - 0.5) * 40; 
            rainPos[i+1] = Math.random() * 40;       
            rainPos[i+2] = (Math.random() - 0.5) * 40; 
        }
        rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
        const rainMat = new THREE.PointsMaterial({ color: 0xa2d2ff, size: 0.4, transparent: true, opacity: 0.8 });
        const rainSystem = new THREE.Points(rainGeo, rainMat);
        scene.add(rainSystem);

        // --- التفاعل ومنطق الدلو ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let heartsCollected = 0;
        let isBucketFull = false;

        function waterTree(amount = 1) {
            if (treeStage >= 4) return;

            growthPoints += amount;
            if (amount > 1) playSound('splash'); // صوت أقوى للدلو
            else playSound('rain');

            // جسيمات شفاء
            const particleCount = amount > 1 ? 5 : 1;
            for(let i=0; i<particleCount; i++) {
                const particle = new THREE.Mesh(
                    new THREE.BoxGeometry(0.5, 0.5, 0.5),
                    new THREE.MeshBasicMaterial({ color: 0xffffff })
                );
                particle.position.set((Math.random()-0.5)*5, 8, (Math.random()-0.5)*5);
                scene.add(particle);
                new TWEEN.Tween(particle.position)
                    .to({ x: 0, y: 0, z: 0 }, 500)
                    .onComplete(() => scene.remove(particle))
                    .start();
            }

            const percent = Math.min(100, Math.floor((growthPoints / (POINTS_PER_STAGE * 3)) * 100));
            document.getElementById('status').innerText = `النمو: ${percent}%`;

            if (growthPoints >= 1 && treeStage < 1) { treeStage=1; updateTree(); }
            if (growthPoints >= POINTS_PER_STAGE && treeStage < 2) { treeStage=2; updateTree(); }
            if (growthPoints >= POINTS_PER_STAGE * 2 && treeStage < 3) { treeStage=3; updateTree(); }
            if (growthPoints >= POINTS_PER_STAGE * 3 && treeStage < 4) { treeStage=4; updateTree(); }
        }

        // تفاعل زر الدلو
        window.handleBucketClick = function() {
            if (treeStage >= 4) return;
            
            if (isBucketFull) {
                // تفريغ الدلو على الشجرة
                waterTree(10); // دفعة كبيرة
                isBucketFull = false;
                updateBucketUI();
            } else {
                // تنبيه المستخدم إذا ضغط وهو فارغ
                const label = document.getElementById('bucket-label');
                const originalText = label.innerText;
                label.innerText = "FILL FROM RIVER";
                label.style.color = "#ff5d8f";
                setTimeout(() => {
                    label.innerText = "EMPTY";
                    label.style.color = "#219ebc";
                }, 2000);
            }
        };

        function updateBucketUI() {
            const btn = document.getElementById('bucket-btn');
            const label = document.getElementById('bucket-label');
            if (isBucketFull) {
                btn.classList.add('full');
                btn.innerHTML = '💧<div class="bucket-label" id="bucket-label">WATER TREE</div>';
            } else {
                btn.classList.remove('full');
                btn.innerHTML = '🪣<div class="bucket-label" id="bucket-label">EMPTY</div>';
            }
        }

        function handleInput(event) {
            event.preventDefault();
            
            let x, y;
            if (event.changedTouches) {
                x = event.changedTouches[0].clientX;
                y = event.changedTouches[0].clientY;
            } else {
                x = event.clientX;
                y = event.clientY;
            }

            mouse.x = (x / window.innerWidth) * 2 - 1;
            mouse.y = -(y / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);

            // 1. فحص الثمار (إذا اكتمل النمو)
            if (treeStage === 4) {
                const intersects = raycaster.intersectObjects(fruits);
                if (intersects.length > 0) {
                    collectFruit(intersects[0].object);
                    return;
                }
            }

            // 2. فحص النهر (لملء الدلو)
            const riverIntersects = raycaster.intersectObjects(riverBlocks);
            if (riverIntersects.length > 0) {
                if (!isBucketFull && treeStage < 4) {
                    isBucketFull = true;
                    playSound('splash');
                    updateBucketUI();
                    
                    // تأثير بصري عند النهر
                    const splash = new THREE.Mesh(
                        new THREE.BoxGeometry(1, 1, 1),
                        new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 })
                    );
                    splash.position.copy(riverIntersects[0].point);
                    splash.position.y += 1;
                    scene.add(splash);
                    new TWEEN.Tween(splash.scale).to({x:2, y:2, z:2}, 300).start();
                    new TWEEN.Tween(splash.material).to({opacity: 0}, 300).onComplete(()=>scene.remove(splash)).start();
                }
                return;
            }

            // 3. السقي العادي (نقرات المطر) إذا لم يكن نهراً
            // (اختياري: يمكنك جعل النقر على الشجرة يفرغ الدلو أيضاً)
            const treeIntersects = raycaster.intersectObjects(treeGroup.children);
            if (treeIntersects.length > 0 && isBucketFull) {
                handleBucketClick(); // تفريغ الدلو
                return;
            }

            waterTree(1); // سقي عادي بالمطر
        }

        function collectFruit(fruitMesh) {
            if (fruitMesh.userData.collected) return;
            fruitMesh.userData.collected = true;
            playSound('fruit');
            new TWEEN.Tween(fruitMesh.scale).to({ x: 0.1, y: 0.1, z: 0.1 }, 200).onComplete(() => {
                fruitMesh.visible = false;
                showCompliment();
            }).start();
            if (heartsCollected < 8) {
                setTimeout(() => {
                    fruitMesh.visible = true;
                    fruitMesh.userData.collected = false;
                    new TWEEN.Tween(fruitMesh.scale).to({x:0.6, y:0.6, z:0.6}, 500).start();
                }, 4000); 
            }
        }

        let complimentIndex = 0;
        function showCompliment() {
            heartsCollected++;
            document.getElementById('heart-count').innerText = heartsCollected;
            const modal = document.getElementById('message-modal');
            const txt = document.getElementById('modal-msg');
            txt.innerText = COMPLIMENTS[complimentIndex % COMPLIMENTS.length];
            complimentIndex++;
            modal.style.display = 'block';
            setTimeout(() => modal.classList.add('active'), 10);
            if (heartsCollected >= 10) { 
                 setTimeout(() => {
                     document.getElementById('final-letter').style.display = 'flex';
                 }, 500);
            }
        }

        window.closeModal = function() {
            const modal = document.getElementById('message-modal');
            modal.classList.remove('active');
            setTimeout(() => modal.style.display = 'none', 300);
        }

        const canvas = document.getElementById('canvas-container');
        canvas.addEventListener('mousedown', handleInput);
        canvas.addEventListener('touchstart', handleInput, { passive: false });

        function animate(time) {
            requestAnimationFrame(animate);
            TWEEN.update(time);
            const positions = rainSystem.geometry.attributes.position.array;
            for(let i=1; i<positions.length; i+=3) {
                positions[i] -= 0.3; 
                if (positions[i] < -10) positions[i] = 20; 
            }
            rainSystem.geometry.attributes.position.needsUpdate = true;
            if (treeGroup) treeGroup.rotation.y = Math.sin(time * 0.001) * 0.05;
            fruits.forEach((f, i) => { if (f.visible) f.position.y += Math.sin(time * 0.003 + i) * 0.005; });
            renderer.render(scene, camera);
        }

        document.getElementById('loading').style.display = 'none';
        animate();

        window.addEventListener('resize', () => {
            const aspect = window.innerWidth / window.innerHeight;
            camera.left = -d * aspect;
            camera.right = d * aspect;
            camera.top = d;
            camera.bottom = -d;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
