<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Kitty Pixel Kiss</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Pixel Font -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        body {
            font-family: 'Press Start 2P', cursive;
            image-rendering: pixelated; /* Ensures things look crisp */
        }

        /* Pixel Art Animations */
        @keyframes float-pixel {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        @keyframes blink {
            0%, 90%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }

        /* Retro "Hard" Shadows for that 8-bit feel */
        .pixel-box {
            box-shadow: 6px 6px 0px 0px #000000;
        }
        
        .pixel-btn {
            box-shadow: 4px 4px 0px 0px #000000;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .pixel-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px 0px #000000;
        }

        .kitty-eye {
            transform-origin: center;
            animation: blink 4s infinite steps(1); /* Steps(1) makes animation jerky/retro */
        }

        /* Speech Bubble Tail */
        .pixel-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: #000 transparent transparent transparent;
        }
        .pixel-bubble-inner::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px 8px 0;
            border-style: solid;
            border-color: #fff transparent transparent transparent;
        }

        /* Prevent button text selection */
        .no-select {
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body class="min-h-screen bg-pink-200 flex items-center justify-center p-4 overflow-hidden relative selection:bg-pink-400 selection:text-white">

    <!-- Background Grid Pattern (CSS generated) -->
    <div class="absolute inset-0 opacity-10 pointer-events-none z-0" 
         style="background-image: linear-gradient(#000 1px, transparent 1px), linear-gradient(90deg, #000 1px, transparent 1px); background-size: 20px 20px;">
    </div>

    <!-- Floating Background Icons -->
    <div id="background-elements" class="absolute inset-0 pointer-events-none overflow-hidden z-0"></div>

    <!-- Main Card -->
    <div id="main-card" class="bg-white border-4 border-black pixel-box max-w-lg w-full p-6 text-center relative z-10" style="min-height: 550px;">
        
        <!-- Retro Header Bar -->
        <div class="bg-pink-500 border-b-4 border-black -mx-6 -mt-6 mb-8 py-2 px-4 flex justify-between items-center">
            <span class="text-white text-xs">♥ HELLO_KITTY.EXE</span>
            <div class="flex gap-2">
                <div class="w-3 h-3 bg-yellow-400 border-2 border-black"></div>
                <div class="w-3 h-3 bg-green-400 border-2 border-black"></div>
                <div class="w-3 h-3 bg-red-400 border-2 border-black"></div>
            </div>
        </div>

        <!-- STATE 1: ASK -->
        <div id="state-ask" class="flex flex-col items-center justify-between h-full relative transition-opacity duration-300">
            
            <!-- Speech Bubble (Hidden initially) -->
            <div id="speech-bubble" class="absolute -top-4 w-full opacity-0 transition-opacity duration-200 z-30 pointer-events-none">
                <div class="pixel-bubble relative bg-black p-1 mx-auto max-w-[90%]">
                    <div class="pixel-bubble-inner bg-white p-3 text-[10px] leading-tight text-black font-bold">
                        "la sm7ili had lkheyar makaynch darori tbrki yes"
                    </div>
                </div>
            </div>

            <!-- Pixel Hello Kitty SVG -->
            <!-- Using shape-rendering="crispEdges" to force pixel look on SVG -->
            <div class="w-48 h-40 relative mb-6 hover:scale-105 transition-transform duration-300">
                <svg viewBox="0 0 200 160" class="w-full h-full drop-shadow-md" shape-rendering="crispEdges">
                    <!-- Outline/Shadow -->
                    <path d="M40 30 L20 60 L50 60 Z" fill="black" transform="translate(4,4)" />
                    <path d="M160 30 L180 60 L150 60 Z" fill="black" transform="translate(4,4)" />
                    <ellipse cx="100" cy="90" rx="85" ry="65" fill="black" transform="translate(4,4)" />

                    <!-- Ears -->
                    <path d="M40 30 L20 60 L50 60 Z" fill="white" stroke="black" stroke-width="4" />
                    <path d="M160 30 L180 60 L150 60 Z" fill="white" stroke="black" stroke-width="4" />
                    
                    <!-- Head -->
                    <ellipse cx="100" cy="90" rx="85" ry="65" fill="white" stroke="black" stroke-width="4" />
                    
                    <!-- Eyes (Pixel Style Rects) -->
                    <rect x="65" y="95" width="10" height="14" fill="black" class="kitty-eye" />
                    <rect x="125" y="95" width="10" height="14" fill="black" class="kitty-eye" />
                    
                    <!-- Nose -->
                    <ellipse cx="100" cy="115" rx="8" ry="5" fill="#FFC107" stroke="black" stroke-width="2" />
                    
                    <!-- Whiskers (Straight lines) -->
                    <line x1="40" y1="95" x2="10" y2="95" stroke="black" stroke-width="4" />
                    <line x1="40" y1="105" x2="10" y2="105" stroke="black" stroke-width="4" />
                    <line x1="40" y1="115" x2="10" y2="115" stroke="black" stroke-width="4" />
                    
                    <line x1="160" y1="95" x2="190" y2="95" stroke="black" stroke-width="4" />
                    <line x1="160" y1="105" x2="190" y2="105" stroke="black" stroke-width="4" />
                    <line x1="160" y1="115" x2="190" y2="115" stroke="black" stroke-width="4" />

                    <!-- Bow -->
                    <g transform="translate(135, 35) rotate(15)">
                        <path d="M0 10 C-10 0 -25 0 -25 15 C-25 30 -10 30 0 20 C10 30 25 30 25 15 C25 0 10 0 0 10" fill="#ff0066" stroke="black" stroke-width="4" />
                        <circle cx="0" cy="15" r="5" fill="#ff0066" stroke="black" stroke-width="4" />
                    </g>
                </svg>
            </div>

            <div class="space-y-4 z-20 mb-8">
                <h1 class="text-xl md:text-2xl text-pink-600 leading-normal" style="text-shadow: 2px 2px 0px #ffd1dc;">
                    Helloooo!
                </h1>
                <div class="bg-pink-100 border-2 border-black p-4 inline-block transform rotate-1">
                    <p class="text-xs md:text-sm text-black leading-relaxed">
                        "3afaaaaaaaaaaaaaaaak 3teni busa"
                    </p>
                </div>
                <p class="text-[10px] text-gray-500 mt-2">
                    (INSERT COIN TO KISS)
                </p>
            </div>

            <div class="flex flex-col gap-6 w-full items-center justify-center mt-4 h-40 relative w-full">
                <!-- Yes Button -->
                <button id="yes-btn" onclick="acceptProposal()" class="pixel-btn bg-pink-500 border-2 border-black text-white py-4 px-8 w-64 flex items-center justify-center gap-3 z-30 cursor-pointer hover:bg-pink-400 no-select">
                    <span class="text-xl">♥</span> YES
                </button>

                <!-- No Button -->
                <button id="no-btn" class="pixel-btn bg-gray-300 border-2 border-black text-gray-600 py-3 px-8 text-xs z-20 cursor-pointer hover:bg-gray-200 no-select w-40">
                    NO
                </button>
            </div>
        </div>

        <!-- STATE 2: SUCCESS -->
        <div id="state-success" class="hidden flex-col items-center justify-center h-full py-8">
            <div class="relative mb-6 animate-[float-pixel_2s_infinite]">
                <!-- Happy Pixel Kitty -->
                <div class="w-48 h-40 relative">
                    <svg viewBox="0 0 200 160" class="w-full h-full drop-shadow-md" shape-rendering="crispEdges">
                         <!-- Head -->
                        <ellipse cx="100" cy="90" rx="85" ry="65" fill="white" stroke="black" stroke-width="4" />
                        <!-- Happy Eyes (Arcs) -->
                        <path d="M65 100 Q70 90 75 100" stroke="black" stroke-width="4" fill="none" />
                        <path d="M125 100 Q130 90 135 100" stroke="black" stroke-width="4" fill="none" />
                        <!-- Nose -->
                        <ellipse cx="100" cy="115" rx="8" ry="5" fill="#FFC107" stroke="black" stroke-width="2" />
                        <!-- Whiskers -->
                        <line x1="40" y1="95" x2="10" y2="95" stroke="black" stroke-width="4" />
                        <line x1="40" y1="105" x2="10" y2="105" stroke="black" stroke-width="4" />
                        <line x1="40" y1="115" x2="10" y2="115" stroke="black" stroke-width="4" />
                        <line x1="160" y1="95" x2="190" y2="95" stroke="black" stroke-width="4" />
                        <line x1="160" y1="105" x2="190" y2="105" stroke="black" stroke-width="4" />
                        <line x1="160" y1="115" x2="190" y2="115" stroke="black" stroke-width="4" />
                        <!-- Bow -->
                        <g transform="translate(135, 35) rotate(15)">
                            <path d="M0 10 C-10 0 -25 0 -25 15 C-25 30 -10 30 0 20 C10 30 25 30 25 15 C25 0 10 0 0 10" fill="#ff0066" stroke="black" stroke-width="4" />
                            <circle cx="0" cy="15" r="5" fill="#ff0066" stroke="black" stroke-width="4" />
                        </g>
                        <!-- Blush (Pixel Dots) -->
                        <rect x="45" y="110" width="10" height="6" fill="#f472b6" opacity="0.6" />
                        <rect x="145" y="110" width="10" height="6" fill="#f472b6" opacity="0.6" />
                    </svg>
                </div>
                
                <!-- 8-Bit Hearts -->
                <div class="absolute -top-10 -left-6 text-red-500 text-4xl animate-bounce">♥</div>
                <div class="absolute top-0 -right-8 text-pink-500 text-2xl animate-bounce delay-100">♥</div>
            </div>

            <h2 class="text-2xl text-pink-600 mb-6 leading-tight" style="text-shadow: 2px 2px 0px #000;">
                MISSION PASSED!<br>
                RESPECT +
            </h2>
            
            <div class="bg-black text-white p-4 border-4 border-pink-400 pixel-box transform -rotate-1">
                <p class="text-sm leading-relaxed text-yellow-300">
                    Kanbghik Bzaaaaf! ❤️
                </p>
            </div>
            
            <p class="mt-8 text-[10px] text-gray-500 animate-pulse">
                PRESS START TO KISS AGAIN
            </p>
        </div>
    </div>

    <script>
        /**
         * 8-Bit Audio Engine
         */
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function play8BitJump() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            // Square wave for 8-bit NES sound
            osc.type = 'square';
            
            // Fast slide up (Jump sound)
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(600, audioCtx.currentTime + 0.1);
            
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.1);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function play8BitWin() {
            if (audioCtx.state === 'suspended') audioCtx.resume();

            // Simple arpeggio
            const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98]; // C E G C E G
            
            notes.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.type = 'square';
                osc.frequency.value = freq;
                
                const startTime = audioCtx.currentTime + (i * 0.1);
                const duration = 0.1;
                
                gain.gain.setValueAtTime(0.05, startTime);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
                
                osc.start(startTime);
                osc.stop(startTime + duration);
            });
        }

        /**
         * Game Logic
         */
        const noBtn = document.getElementById('no-btn');
        const yesBtn = document.getElementById('yes-btn');
        const mainCard = document.getElementById('main-card');
        const stateAsk = document.getElementById('state-ask');
        const stateSuccess = document.getElementById('state-success');
        const speechBubble = document.getElementById('speech-bubble');
        const bgContainer = document.getElementById('background-elements');

        function moveNoButton() {
            play8BitJump();

            // Show Speech Bubble with Darija Text
            speechBubble.style.opacity = '1';
            
            // Shake effect on card
            mainCard.style.transform = 'translate(2px, 2px)';
            setTimeout(() => mainCard.style.transform = 'translate(0, 0)', 50);

            const cardRect = mainCard.getBoundingClientRect();
            const btnWidth = 120; // Approx
            const btnHeight = 50;

            const maxLeft = cardRect.width - btnWidth - 50; // Padding
            const maxTop = cardRect.height - btnHeight - 50;

            const newLeft = Math.random() * maxLeft + 25;
            const newTop = Math.random() * maxTop + 25;

            noBtn.style.position = 'absolute';
            noBtn.style.left = newLeft + 'px';
            noBtn.style.top = newTop + 'px';
        }

        noBtn.addEventListener('mouseenter', moveNoButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveNoButton();
        });

        function acceptProposal() {
            play8BitWin();
            
            stateAsk.style.display = 'none';
            stateSuccess.style.display = 'flex';
            stateSuccess.classList.remove('hidden');

            // Square Confetti
            var duration = 3000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 3,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#ff00ff', '#00ffff', '#ffff00'],
                    shapes: ['square'] // Pixel style confetti
                });
                confetti({
                    particleCount: 3,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#ff00ff', '#00ffff', '#ffff00'],
                    shapes: ['square']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        /**
         * Pixel Background Generator
         */
        function createBackground() {
            const symbols = ['♥', '+', '★']; // Simple pixel shapes
            const colors = ['text-pink-400', 'text-purple-400', 'text-blue-400'];
            
            for (let i = 0; i < 15; i++) {
                const el = document.createElement('div');
                el.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                
                const left = Math.random() * 100;
                const top = Math.random() * 100;
                const size = Math.random() * 2 + 1; // rem
                const duration = Math.random() * 5 + 5;
                const color = colors[Math.floor(Math.random() * colors.length)];

                el.className = `absolute ${color} select-none opacity-30`;
                el.style.left = `${left}%`;
                el.style.top = `${top}%`;
                el.style.fontSize = `${size}rem`;
                el.style.animation = `float-pixel ${duration}s steps(5) infinite`; // steps(5) makes it jerky

                bgContainer.appendChild(el);
            }
        }

        createBackground();
    </script>
</body>
</html>
