<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello Kitty Kiss Request</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom animations */
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }
        
        .animate-in {
            animation: fadeInZoom 0.5s ease-out forwards;
        }

        @keyframes fadeInZoom {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Ensure smooth movement for the No button */
        #no-btn {
            transition: all 0.2s ease;
        }
    </style>
</head>
<body class="min-h-screen bg-pink-100 flex items-center justify-center p-4 font-sans overflow-hidden relative selection:bg-pink-200">

    <!-- Background Elements Container -->
    <div id="background-elements" class="absolute inset-0 opacity-20 pointer-events-none overflow-hidden">
        <!-- JS will populate this -->
    </div>

    <!-- Main Card -->
    <div id="main-card" class="bg-white max-w-md w-full rounded-3xl shadow-2xl p-8 text-center border-4 border-pink-200 relative overflow-hidden" style="min-height: 500px;">
        
        <!-- Header Bow Icon (Background) -->
        <div class="absolute -top-6 -right-6 text-pink-400 opacity-20 transform rotate-12">
            <svg xmlns="http://www.w3.org/2000/svg" width="150" height="150" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
            </svg>
        </div>

        <!-- STATE 1: ASK -->
        <div id="state-ask" class="flex flex-col items-center justify-between h-full py-8 z-10 relative transition-opacity duration-300">
            
            <!-- Hello Kitty Face SVG -->
            <div class="w-48 h-40 relative mb-6">
                <svg viewBox="0 0 200 160" class="w-full h-full drop-shadow-lg">
                    <!-- Ears -->
                    <path d="M40 30 L20 60 L50 60 Z" fill="white" stroke="#333" stroke-width="3" stroke-linejoin="round" />
                    <path d="M160 30 L180 60 L150 60 Z" fill="white" stroke="#333" stroke-width="3" stroke-linejoin="round" />
                    <!-- Head -->
                    <ellipse cx="100" cy="90" rx="85" ry="65" fill="white" stroke="#333" stroke-width="3" />
                    <!-- Eyes -->
                    <ellipse cx="70" cy="100" rx="5" ry="8" fill="#333" />
                    <ellipse cx="130" cy="100" rx="5" ry="8" fill="#333" />
                    <!-- Nose -->
                    <ellipse cx="100" cy="115" rx="6" ry="4" fill="#FFC107" stroke="#333" stroke-width="1" />
                    <!-- Whiskers Left -->
                    <path d="M40 95 L10 90" stroke="#333" stroke-width="2" stroke-linecap="round" />
                    <path d="M40 105 L10 105" stroke="#333" stroke-width="2" stroke-linecap="round" />
                    <path d="M40 115 L10 120" stroke="#333" stroke-width="2" stroke-linecap="round" />
                    <!-- Whiskers Right -->
                    <path d="M160 95 L190 90" stroke="#333" stroke-width="2" stroke-linecap="round" />
                    <path d="M160 105 L190 105" stroke="#333" stroke-width="2" stroke-linecap="round" />
                    <path d="M160 115 L190 120" stroke="#333" stroke-width="2" stroke-linecap="round" />
                    <!-- Bow -->
                    <g transform="translate(135, 35) rotate(15)">
                        <path d="M0 10 C-10 0 -25 0 -25 15 C-25 30 -10 30 0 20 C10 30 25 30 25 15 C25 0 10 0 0 10" fill="#FF4081" stroke="#333" stroke-width="2" />
                        <circle cx="0" cy="15" r="5" fill="#FF4081" stroke="#333" stroke-width="2" />
                    </g>
                </svg>
            </div>

            <div class="space-y-2">
                <h1 class="text-3xl font-extrabold text-pink-500 tracking-tight">Helloooo!</h1>
                <p class="text-xl font-bold text-gray-700 mt-4 leading-relaxed px-4">"3afaaaaaaaaaaaaaaaak 3teni busa"</p>
                <p class="text-sm text-pink-400 mt-2 italic">(Pleeeeeeease give me a kiss)</p>
            </div>

            <div class="flex flex-col gap-4 w-full items-center justify-center mt-12 h-32 relative w-full">
                <!-- Yes Button -->
                <button id="yes-btn" onclick="acceptProposal()" class="bg-pink-500 hover:bg-pink-600 text-white font-bold py-3 px-12 rounded-full shadow-lg transform hover:scale-110 transition-all duration-200 flex items-center gap-2 z-20 cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
                    Yes, Okay!
                </button>

                <!-- No Button -->
                <button id="no-btn" class="bg-gray-200 hover:bg-gray-300 text-gray-600 font-bold py-2 px-8 rounded-full shadow-md text-sm whitespace-nowrap z-10 cursor-pointer">
                    No
                </button>
            </div>
        </div>

        <!-- STATE 2: SUCCESS (Hidden by default) -->
        <div id="state-success" class="hidden flex-col items-center justify-center h-full py-10 animate-in">
            <div class="relative mb-8">
                <!-- Happy Hello Kitty SVG -->
                <div class="w-48 h-40 relative animate-bounce">
                    <svg viewBox="0 0 200 160" class="w-full h-full drop-shadow-xl">
                        <path d="M40 30 L20 60 L50 60 Z" fill="white" stroke="#333" stroke-width="3" stroke-linejoin="round" />
                        <path d="M160 30 L180 60 L150 60 Z" fill="white" stroke="#333" stroke-width="3" stroke-linejoin="round" />
                        <ellipse cx="100" cy="90" rx="85" ry="65" fill="white" stroke="#333" stroke-width="3" />
                        <!-- Happy Eyes -->
                        <path d="M60 100 Q70 90 80 100" stroke="#333" stroke-width="3" fill="none" />
                        <path d="M120 100 Q130 90 140 100" stroke="#333" stroke-width="3" fill="none" />
                        <ellipse cx="100" cy="115" rx="6" ry="4" fill="#FFC107" stroke="#333" stroke-width="1" />
                        <!-- Whiskers -->
                        <path d="M40 95 L10 90" stroke="#333" stroke-width="2" stroke-linecap="round" />
                        <path d="M40 105 L10 105" stroke="#333" stroke-width="2" stroke-linecap="round" />
                        <path d="M40 115 L10 120" stroke="#333" stroke-width="2" stroke-linecap="round" />
                        <path d="M160 95 L190 90" stroke="#333" stroke-width="2" stroke-linecap="round" />
                        <path d="M160 105 L190 105" stroke="#333" stroke-width="2" stroke-linecap="round" />
                        <path d="M160 115 L190 120" stroke="#333" stroke-width="2" stroke-linecap="round" />
                        <!-- Bow -->
                        <g transform="translate(135, 35) rotate(15)">
                            <path d="M0 10 C-10 0 -25 0 -25 15 C-25 30 -10 30 0 20 C10 30 25 30 25 15 C25 0 10 0 0 10" fill="#FF4081" stroke="#333" stroke-width="2" />
                            <circle cx="0" cy="15" r="5" fill="#FF4081" stroke="#333" stroke-width="2" />
                        </g>
                        <!-- Blush -->
                        <ellipse cx="50" cy="110" rx="10" ry="6" fill="#FF80AB" opacity="0.6" />
                        <ellipse cx="150" cy="110" rx="10" ry="6" fill="#FF80AB" opacity="0.6" />
                    </svg>
                </div>
                
                <!-- Floating Hearts -->
                <div class="absolute -top-10 -left-10 text-red-500 animate-bounce" style="animation-delay: 100ms">
                    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
                </div>
                <div class="absolute top-0 -right-12 text-pink-500 animate-bounce" style="animation-delay: 300ms">
                    <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
                </div>
                <div class="absolute -bottom-5 left-20 text-red-400 animate-bounce" style="animation-delay: 700ms">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
                </div>
            </div>

            <h2 class="text-4xl font-extrabold text-pink-600 mb-4">YAAAAY!</h2>
            <p class="text-2xl text-gray-700 mb-8 font-medium">Kanbghik Bzaaaaf! ❤️</p>
            <p class="text-lg text-pink-500 bg-pink-50 px-6 py-2 rounded-full border border-pink-200 shadow-sm">*sefteha f insta ehm* 😽💋</p>
        </div>
    </div>

    <script>
        // Logic Variables
        let noHoverCount = 0;
        const rejectionPhrases = [
            "No",
            "Are you sure?",
            "Think again!",
            "Don't break my heart!",
            "Look at this cute face!",
            "3afaaaaak!",
            "Pretty please?",
            "I'm fast!",
            "You can't catch me!",
            "Just click Yes!"
        ];

        // DOM Elements
        const noBtn = document.getElementById('no-btn');
        const yesBtn = document.getElementById('yes-btn');
        const mainCard = document.getElementById('main-card');
        const stateAsk = document.getElementById('state-ask');
        const stateSuccess = document.getElementById('state-success');
        const bgContainer = document.getElementById('background-elements');

        // Setup "No" Button Interactions
        function moveNoButton() {
            // Get boundaries
            const cardRect = mainCard.getBoundingClientRect();
            
            // Fixed Button Size Approximation
            const btnWidth = 120;
            const btnHeight = 50;

            // Calculate safe bounds ensuring button stays inside the pink card
            // We use client dimensions of the card relative to itself
            const maxLeft = cardRect.width - btnWidth - 40; // 20px padding
            const maxTop = cardRect.height - btnHeight - 40;

            // Generate new random position
            const newLeft = Math.random() * maxLeft + 20;
            const newTop = Math.random() * maxTop + 20;

            // Apply styles
            noBtn.style.position = 'absolute';
            noBtn.style.left = newLeft + 'px';
            noBtn.style.top = newTop + 'px';

            // Update text
            noHoverCount++;
            const textIndex = Math.min(noHoverCount, rejectionPhrases.length - 1);
            noBtn.innerText = rejectionPhrases[textIndex];
        }

        // Add Listeners to No Button
        noBtn.addEventListener('mouseenter', moveNoButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); // prevents click
            moveNoButton();
        });

        // Setup "Yes" Button Interaction
        function acceptProposal() {
            stateAsk.style.display = 'none';
            stateSuccess.style.display = 'flex';
            stateSuccess.classList.remove('hidden');
        }

        // Generate Background Elements
        function createBackground() {
            const symbols = ['♥', '🎀'];
            for (let i = 0; i < 20; i++) {
                const el = document.createElement('div');
                el.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                
                // Random styles
                const left = Math.random() * 100;
                const top = Math.random() * 100;
                const rotation = Math.random() * 360;
                const size = Math.random() * 2 + 1;
                const delay = Math.random() * 5;

                el.className = 'absolute text-pink-300 animate-pulse select-none';
                el.style.left = `${left}%`;
                el.style.top = `${top}%`;
                el.style.transform = `rotate(${rotation}deg)`;
                el.style.fontSize = `${size}rem`;
                el.style.animationDelay = `${delay}s`;

                bgContainer.appendChild(el);
            }
        }

        // Initialize Background
        createBackground();
    </script>
</body>
</html>
